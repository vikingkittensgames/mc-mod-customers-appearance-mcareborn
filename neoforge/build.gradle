plugins {
    id 'java-library'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
    id 'com.diffplug.spotless'
}

version = mod_version
group = mod_group_id
def customersJar = file("../../neoforge/build/libs/customers-neoforge-${minecraft_version}-${customers_version}.jar")

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}
configurations.compileClasspath.extendsFrom(configurations.common)
configurations.testCompileClasspath.extendsFrom(configurations.common)
configurations.testRuntimeClasspath.extendsFrom(configurations.common)

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        importOrder('java', '', 'com.mojang|net.minecraft', 'net.conczin', 'net.neoforged', 'com.vikingkittens', '\\#')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') { dependsOn tasks.named('spotlessCheck') }

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir = "../run-neoforge-${minecraft_version}"
        }
        server {
            server()
            runDir = "../run-neoforge-${minecraft_version}"
            programArg '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    neoForge "net.neoforged:neoforge:${neo_version}"
    modCompileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    modLocalRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    modCompileOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_neoforge_version}"
    modLocalRuntime "maven.modrinth:minecraft-comes-alive-reborn:${mca_neoforge_version}"
    testRuntimeOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_neoforge_version}"
    compileOnly files(customersJar)
    testImplementation files(customersJar)
    modLocalRuntime files(customersJar)
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, loader_version_range: loader_version_range,
                      architectury_version_range: architectury_version_range, customers_version_range: customers_version_range,
                      mca_version_range: mca_version_range, mod_id: mod_id, mod_name: mod_name,
                      mod_license: mod_license, mod_version: mod_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('shadowJar', Jar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    inputFile = tasks.named('shadowJar').flatMap { it.archiveFile }
}

tasks.named('test') { useJUnitPlatform() }
