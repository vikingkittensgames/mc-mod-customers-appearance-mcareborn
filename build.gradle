plugins {
    id 'base'
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_plugin_version}" apply false
    id 'com.diffplug.spotless' version '8.9.0' apply false
}

tasks.register('buildFabric') { dependsOn(':fabric:build') }
tasks.register('buildNeoForge') { dependsOn(':neoforge:build') }
tasks.register('buildAllLoaders') { dependsOn('buildFabric', 'buildNeoForge') }
tasks.register('testAllLoaders') { dependsOn(':common:test', ':fabric:test', ':neoforge:test') }
tasks.register('runClientFabric') { dependsOn(':fabric:runClient') }
tasks.register('runClientNeoForge') { dependsOn(':neoforge:runClient') }
