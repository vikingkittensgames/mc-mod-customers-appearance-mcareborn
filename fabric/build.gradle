import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

import org.gradle.api.artifacts.transform.CacheableTransform
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.attributes.Attribute
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'java-library'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
    id 'com.diffplug.spotless'
}

@CacheableTransform
abstract class RemoveNewerLoomVersion implements TransformAction<TransformParameters.None> {
    @PathSensitive(PathSensitivity.NAME_ONLY)
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        def input = inputArtifact.get().asFile
        def output = outputs.file(input.name.replace('.jar', '-architectury-loom-input.jar'))
        new ZipInputStream(new BufferedInputStream(new FileInputStream(input))).withCloseable { zipInput ->
            new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(output))).withCloseable { zipOutput ->
                ZipEntry entry
                while ((entry = zipInput.nextEntry) != null) {
                    def outputEntry = new ZipEntry(entry.name)
                    outputEntry.time = entry.time
                    zipOutput.putNextEntry(outputEntry)
                    if (entry.name == 'META-INF/MANIFEST.MF') {
                        def manifest = new String(zipInput.readAllBytes(), 'UTF-8')
                                .replaceAll('(?m)^Fabric-Loom-Version:.*\\r?\\n', '')
                        zipOutput.write(manifest.getBytes('UTF-8'))
                    } else {
                        zipInput.transferTo(zipOutput)
                    }
                    zipOutput.closeEntry()
                }
            }
        }
    }
}

version = mod_version
group = mod_group_id
def customersCompileJar = file("../../neoforge/build/libs/customers-neoforge-${minecraft_version}-${customers_version}.jar")
def customersRuntimeJar = file("../../fabric/build/libs/customers-fabric-${minecraft_version}-${customers_version}.jar")
def mcaDevArtifactType = Attribute.of('customers.mca.fabric.dev-artifact', String)

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://api.modrinth.com/maven' }
}

base { archivesName = "${mod_id}-fabric-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    mcaFabricDev {
        canBeResolved = true
        canBeConsumed = false
        attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'mca-architectury-loom-input')
        attributes.attribute(mcaDevArtifactType, 'compatible')
    }
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}
configurations.compileClasspath.extendsFrom(configurations.common)
configurations.testCompileClasspath.extendsFrom(configurations.common)
configurations.testRuntimeClasspath.extendsFrom(configurations.common)

spotless {
    java {
        target 'src/main/java/**/*.java'
        importOrder('java', '', 'com.mojang|net.minecraft', 'net.fabricmc', 'com.vikingkittens', '\\#')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') { dependsOn tasks.named('spotlessCheck') }

dependencies.registerTransform(RemoveNewerLoomVersion) {
    from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
            .attribute(mcaDevArtifactType, 'compatible')
    to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'mca-architectury-loom-input')
            .attribute(mcaDevArtifactType, 'compatible')
}

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir = "../run-fabric-${minecraft_version}"
        }
        server {
            server()
            runDir = "../run-fabric-${minecraft_version}"
            programArg '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_neoforge_version}"
    mcaFabricDev("maven.modrinth:minecraft-comes-alive-reborn:${mca_fabric_version}") {
        attributes { attribute(mcaDevArtifactType, 'compatible') }
    }
    modLocalRuntime files(configurations.mcaFabricDev)
    compileOnly files(customersCompileJar)
    modLocalRuntime files(customersRuntimeJar)
    implementation project(path: ':common', configuration: 'namedElements')
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'namedElements')) { transitive = false }
}

tasks.named('processResources', ProcessResources) {
    inputs.properties([architectury_version: architectury_version, customers_fabric_version_range: customers_fabric_version_range,
                       fabric_api_version: fabric_api_version, fabric_loader_version: fabric_loader_version,
                       minecraft_version: minecraft_version, mca_fabric_version_range: mca_fabric_version_range,
                       mod_id: mod_id, mod_name: mod_name, mod_version: mod_version])
    filesMatching('fabric.mod.json') { expand(inputs.properties) }
}

tasks.named('shadowJar', Jar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    inputFile = tasks.named('shadowJar').flatMap { it.archiveFile }
}
